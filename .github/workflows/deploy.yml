name: Deploy Flet App to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true  # Beschleunigt zukünftige Builds enorm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies with uv
        run: |
          uv sync --all-extras
          uv pip install flet  # Garantiert, dass die Flet-CLI verfügbar ist

      - name: Clean previous build artifacts
        run: |
          rm -rf dist src/dist

      - name: Export requirements from uv and publish Flet App
        run: |
          # 1. Erzeuge eine explizite requirements.txt im src/-Ordner
          uv export --format requirements-txt --no-dev -o src/requirements.txt
          
          # 2. Flet Publish ausführen
          uv run flet publish src/main.py --base-url /rain-radar/
          
          # 3. Base-Tag & URLs in index.html korrigieren
          sed -i -E 's/<base href="[^"]*">/<base href="\/rain-radar\/">/g' src/dist/index.html
          sed -i 's/"entrypointBaseUrl": "\/"/"entrypointBaseUrl": "\/rain-radar\/"/g' src/dist/index.html
          sed -i 's/flet.entrypointBaseUrl="\/"/flet.entrypointBaseUrl="\/rain-radar\/"/g' src/dist/index.html
          sed -i 's/"assetBase": "\/"/"assetBase": "\/rain-radar\/"/g' src/dist/index.html
          sed -i 's/flet.assetBase="\/"/flet.assetBase="\/rain-radar\/"/g' src/dist/index.html
          
          # 4. Bootstrapper-Konfigurationen anpassen
          find src/dist -name "*.js" -exec sed -i 's/"baseHref":"\/"/"baseHref":"\/rain-radar\/"/g' {} +
          find src/dist -name "*.json" -exec sed -i 's/"baseHref":"\/"/"baseHref":"\/rain-radar\/"/g' {} +
          
          # 5. Fertigen Build nach dist/ verschieben
          mv src/dist dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4