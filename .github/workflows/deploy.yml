name: Deploy Flet App to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true  # Beschleunigt zukünftige Builds enorm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies with uv
        run: |
          uv sync --all-extras
          uv pip install flet  # Garantiert, dass die Flet-CLI verfügbar ist

      - name: Publish Flet App to Web (Static)
        run: |
          uv run flet publish src/main.py --base-url /rain-radar/
          
          # Base-Tag in index.html anpassen
          sed -i -E 's/<base href="[^"]*">/<base href="\/rain-radar\/">/g' dist/index.html
          
          # assetBase in flutter_bootstrap.js setzen
          sed -i 's/\{\}/{"assetBase":"\/rain-radar\/"}/g' dist/flutter_bootstrap.js || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4