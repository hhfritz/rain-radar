name: Deploy Flet App to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true  # Beschleunigt zukünftige Builds enorm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies with uv
        run: |
          uv sync --all-extras
          uv pip install flet  # Garantiert, dass die Flet-CLI verfügbar ist

      - name: Publish Flet App to Web (Static)
        run: |
          uv run flet publish src/main.py --base-url /rain-radar/
          
          sed -i 's/<base href="\/">/<base href="\/rain-radar\/">/g' dist/index.html

          # Fix für Asset- & FontManifest-Pfade in Flutter/Flet Web auf GitHub Pages
          sed -i 's/"baseHref":"\/"/"baseHref":"\/rain-radar\/"/g' dist/
          sed -i 's/"assetBase":""/"assetBase":"\/rain-radar\/"/g' dist/assets/
          sed -i 's/"\/assets\/"/"\/rain-radar\/assets\/"/g' dist/assets/ || true
          sed -i 's/"start_url": "\/"/"start_url": "\/rain-radar\/"/g' dist/manifest.json || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4